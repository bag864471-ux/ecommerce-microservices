version: '3.8'

services:
  # API Gateway
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PRODUCT_SERVICE_URL=http://product-service:8002
      - ORDER_SERVICE_URL=http://order-service:8003
    depends_on:
      - auth-service
      - product-service
      - order-service

  # Auth Service
  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres-auth:5432/authdb
      - JWT_SECRET=your-secret-key
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres-auth
      - redis

  # Product Service
  product-service:
    build: ./services/product-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres-product:5432/productdb
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - postgres-product
      - redis

  # Order Service
  order-service:
    build: ./services/order-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres-order:5432/orderdb
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - postgres-order
      - kafka

  # Payment Service
  payment-service:
    build: ./services/payment-service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres-payment:5432/paymentdb
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - postgres-payment
      - kafka

  # Inventory Service
  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres-inventory:5432/inventorydb
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - postgres-inventory
      - kafka

  # Notification Service
  notification-service:
    build: ./services/notification-service
    ports:
      - "8006:8006"
    environment:
      - KAFKA_BROKER=kafka:9092
      - SMTP_HOST=smtp.gmail.com
    depends_on:
      - kafka

  # Shipping Service
  shipping-service:
    build: ./services/shipping-service
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres-shipping:5432/shippingdb
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - postgres-shipping
      - kafka

  # Databases
  postgres-auth:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=authdb
    volumes:
      - auth_data:/var/lib/postgresql/data

  postgres-product:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=productdb
    volumes:
      - product_data:/var/lib/postgresql/data

  postgres-order:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orderdb
    volumes:
      - order_data:/var/lib/postgresql/data

  postgres-payment:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=paymentdb
    volumes:
      - payment_data:/var/lib/postgresql/data

  postgres-inventory:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=inventorydb
    volumes:
      - inventory_data:/var/lib/postgresql/data

  postgres-shipping:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shippingdb
    volumes:
      - shipping_data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper

volumes:
  auth_data:
  product_data:
  order_data:
  payment_data:
  inventory_data:
  shipping_data:
